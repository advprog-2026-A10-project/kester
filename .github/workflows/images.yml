name: images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: advprog-2026-a10-project

jobs:
  build-and-push:
    name: build and push images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth-be
            dockerfile: deploy/dockerfiles/auth-be.Dockerfile
            image: kester-auth-be
            api_base_url: https://api.auth.bidmart.bid
          - service: auth-fe
            dockerfile: deploy/dockerfiles/auth-fe.Dockerfile
            image: kester-auth-fe
            api_base_url: https://api.auth.bidmart.bid
          - service: core-be
            dockerfile: deploy/dockerfiles/core-be.Dockerfile
            image: kester-core-be
            api_base_url: https://api.bidmart.bid
          - service: core-fe
            dockerfile: deploy/dockerfiles/core-fe.Dockerfile
            image: kester-core-fe
            api_base_url: https://api.bidmart.bid
          - service: admin-be
            dockerfile: deploy/dockerfiles/admin-be.Dockerfile
            image: kester-admin-be
            api_base_url: https://admin-api.bidmart.bid
          - service: admin-fe
            dockerfile: deploy/dockerfiles/admin-fe.Dockerfile
            image: kester-admin-fe
            api_base_url: https://admin-api.bidmart.bid
          - service: bidding-ws
            dockerfile: deploy/dockerfiles/bidding-ws.Dockerfile
            image: kester-bidding-ws
            api_base_url: https://api.bidmart.bid
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}
          tags: |
            type=sha,format=short,prefix=
            type=raw,value=latest

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_BASE_URL=${{ matrix.api_base_url }}
            VITE_REDIRECT_URL=https://bidmart.bid
            VITE_ALLOWED_REDIRECT_ORIGINS=https://bidmart.bid
            VITE_BIDDING_WS_URL=wss://ws.bidmart.bid
            VITE_AUTH_API_BASE_URL=https://api.auth.bidmart.bid
            VITE_AUTH_LOGIN_URL=https://auth.bidmart.bid/login

  compose-image-config:
    name: validate image compose config
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Validate compose with GHCR image tags
        run: docker compose --env-file .env.ci -f docker-compose.yml config
